<style>
:root { --bg: #f6f6f4; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #2f5d8a; --err: #b3261e; }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

button { width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#msg { min-height: 20px; margin: 12px 0 0; color: var(--err); font-size: 14px; }
</style>

const KEY_NAME = "bsjd-key-" + P.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256);
}

async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  document.open();
  document.write(html);
  document.close();
}

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (!saved) return;
  try { await open(b64(saved)); }
  catch (e) { try { localStorage.removeItem(KEY_NAME); } catch (e2) {} }
})();

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go");
  const msg = document.getElementById("msg");
  btn.disabled = true;
  msg.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_NAME, enc(raw)); } catch (e) {}
    }
    await open(raw);
  } catch (e) {
    msg.textContent = "비밀번호가 맞지 않습니다.";
    btn.disabled = false;
  }
});
</script>
