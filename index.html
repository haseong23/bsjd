const KEY_NAME = "bsjd-key-" + P.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256);
}

async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  document.open();
  document.write(html);
  document.close();
}

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (!saved) return;
  try { await open(b64(saved)); }
  catch (e) { try { localStorage.removeItem(KEY_NAME); } catch (e2) {} }
})();

  ev.preventDefault();
  const btn = document.getElementById("go");
  const msg = document.getElementById("msg");
  btn.disabled = true;
  msg.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_NAME, enc(raw)); } catch (e) {}
    }
    await open(raw);
  } catch (e) {
    msg.textContent = "비밀번호가 맞지 않습니다.";
    btn.disabled = false;
  }
});
</script>
</body>
